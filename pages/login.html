<!Doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <link href="/src/output.css" rel="stylesheet">
  <link href="/src/input.css" rel="stylesheet">

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/icon?family=Material+Icons" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>

<body class="mx-auto font-PlayfairDisplay">

  <div class="flex flex-col lg:flex-row min-h-screen">

    <!-- Background Image -->
    <div class="w-full lg:w-1/2 h-75 lg:h-screen ">
      <div
        class="w-full h-screen bg-[url(/imgs/login.jpg)] bg-center bg-cover bg-no-repeat">
      </div>
    </div>

    <!-- Sign In -->
    <div
      class="w-full lg:w-1/2 flex items-center justify-center px-6 py-10 lg:px-12">

      <div class="w-full max-w-xl">

        <!-- Title -->
        <div>
          <p class="text-3xl md:text-4xl font-semibold">
            SIGN IN
          </p>
        </div>

        <!-- Email -->
        <div class="mt-10 flex flex-col gap-2">
          <label for="email">EMAIL</label>

          <input
            type="email"
            placeholder="Enter your email"
            class="pl-4 w-full h-14 border border-gray-500 outline-none focus:border-amber-800">
        </div>

        <!-- Password -->
        <div class="mt-8 flex flex-col gap-2">
          <label for="password">PASSWORD</label>

          <input
            type="password"
            placeholder="********"
            class="pl-4 w-full h-14 border border-gray-500 outline-none focus:border-amber-800">
        </div>

        <!-- Conditions -->
        <div class="mt-8 flex flex-col gap-4 text-sm md:text-base">

          <div class="flex items-start gap-3">
            <svg xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-6 h-6 bg-gray-600 rounded-full text-white shrink-0">

              <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>

            <p>Minimum 8 characters</p>
          </div>

          <div class="flex items-start gap-3">
            <svg xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-6 h-6 bg-gray-600 rounded-full text-white shrink-0">

              <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>

            <p>Must contain at least 1 number</p>
          </div>

          <div class="flex items-start gap-3">
            <svg xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-6 h-6 bg-gray-600 rounded-full text-white shrink-0">

              <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>

            <p>
              Must contain at least 1 capital case and
              1 small case
            </p>
          </div>

          <div class="flex items-start gap-3">
            <svg xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-6 h-6 bg-gray-600 rounded-full text-white shrink-0">

              <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>

            <p>Must contain at least 1 symbol</p>
          </div>

        </div>

        <!-- Button -->
        <div class="mt-10">
          <button
            class="w-full h-14 bg-amber-800 text-xl md:text-2xl text-white cursor-pointer hover:bg-amber-900 duration-300">
            BUTTON
          </button>
        </div>

        <!-- Registration -->
        <div class="mt-8 text-sm md:text-base">
          <p>
            Don’t have account?

            <a href="/pages/checkout.html"
              class="underline hover:text-amber-800">
              Register here
            </a>
          </p>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
